<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Almanca Kelime Asistanı</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
<main style="max-width: 640px">
  <h1 data-i18n="optTitle"></h1>
  <p class="lead" data-i18n="optLead"></p>

  <form class="panel" id="form">
    <div class="field">
      <label for="lang" data-i18n="optLang"></label>
      <select id="lang">
        <option value="tr">Deutsch – Türkçe</option>
        <option value="en">Deutsch – English</option>
      </select>
      <p class="hint" data-i18n="optLangHint"></p>
    </div>

    <div class="field">
      <label for="source" data-i18n="optSource"></label>
      <select id="source">
        <option value="free" data-i18n="optSourceFree"></option>
        <option value="claude" data-i18n="optSourceClaude"></option>
      </select>
      <p class="hint" data-i18n="optSourceHint"></p>
    </div>

    <div id="claudeFields">
      <div class="field">
        <label for="apiKey" data-i18n="optKey"></label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
        <p class="hint"><span data-i18n="optKeyHint"></span>
          <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a></p>
      </div>

      <div class="field">
        <label for="model" data-i18n="optModel"></label>
        <select id="model">
          <option value="claude-opus-5-5" data-i18n="optModelOpus"></option>
          <option value="claude-sonnet-5-5" data-i18n="optModelSonnet"></option>
          <option value="claude-haiku-5-5" data-i18n="optModelHaiku"></option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="direction" data-i18n="optDirection"></label>
      <select id="direction">
        <option value="auto" data-i18n="optDirAuto"></option>
        <option value="from-de" data-i18n="optDirFromDe"></option>
        <option value="to-de" data-i18n="optDirToDe"></option>
      </select>
      <p class="hint" data-i18n="optDirHint"></p>
    </div>

    <div class="row">
      <button class="btn" type="submit" data-i18n="optSave"></button>
      <button class="btn ghost" type="button" id="test" data-i18n="optTest"></button>
      <span class="status" id="status"></span>
    </div>
  </form>

  <div class="panel row" style="justify-content: space-between">
    <span data-i18n="optCache"></span>
    <button class="btn ghost" type="button" id="clearCache" data-i18n="optClearCache"></button>
  </div>

  <p><a href="words.html" data-i18n="optToWords"></a></p>
</main>
<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
